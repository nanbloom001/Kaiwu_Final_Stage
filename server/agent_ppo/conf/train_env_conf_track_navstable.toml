[env]
num_envs = 3072
episode_length_s = 120.0

[env_conf]
seed = 0

# Stage 3: Nav Stable（对应 nav_plan.md 第十三章）
# 目标：降低坡地/楼梯异常率，提高完整赛道稳定性
# 改动（相对 navbase）：
#   1. terrain 扩展到完整 5 段 track（坡+反坡+楼梯+反楼梯+迷宫）
#   2. difficulty 从 [0,0.6] 逐步扩展，curriculum=true 让机器人从低难度过渡
#   3. commands 提速到 [0.55,0.80]
#   4. 新增第二组 reward（足端/楼梯/步态精调）
# 预训练来源：Stage 2 navbase 产物（model.ckpt-nav-*）
[terrain]
mode = "track"
num_rows = 10
num_cols = 10
difficulty_range = [0.0, 0.6]
curriculum = true
max_init_terrain_level = 0

[terrain.track]
track_length = 5
sub_terrains = ["pyramid_slope", "pyramid_slope_inv", "pyramid_stairs", "pyramid_stairs_inv", "open_entry_maze"]

[domain_rand]
enable_domain_rand = true
randomize_friction = true
friction_range = [0.45, 1.4]
push_robots = false
push_interval_s = 15
max_push_vel_xy = 0.5

[noise]
add_noise = true

[init_state]
pos = [0.0, 0.0, 0.35]

# 恒速直线锚点，提速到 xtrack6 水平
[commands]
resampling_time = [2.5, 4.0]

[commands.limit]
lin_vel_x = [0.0, 1.25]
lin_vel_y = [-0.0, 0.0]
ang_vel_z = [-1.2, 1.2]

[commands.ranges]
lin_vel_x = [0.55, 0.80]
lin_vel_y = [0.0, 0.0]
ang_vel_yaw = [0.0, 0.0]

[navigation]
enabled = false

[rl_navigation]
phase_command_enabled = false
worker_phase_command_enabled = false
gate_speed_advice_enabled = false
gate_reward_metrics_enabled = false
# 评估时强制覆盖 obs 命令槽位为训练恒速，解决评估命令和训练不一致的问题
eval_command_override = true
eval_command = [0.55, 0.0, 0.0]

# =============================================================================
# 第一组：基础运动保持（nav_plan.md 9.2）—— 继承自 navbase
# =============================================================================
[rewards.track_lin_vel_xy]
weight = 1.08
[rewards.track_lin_vel_xy.params]
std = 0.24
command_name = "base_velocity"

[rewards.track_ang_vel_z]
weight = 0.045
[rewards.track_ang_vel_z.params]
std = 0.35
command_name = "base_velocity"

[rewards.lin_vel_z]
weight = -0.60

[rewards.ang_vel_xy]
weight = -0.55

[rewards.joint_acc]
weight = -4.5e-7

[rewards.joint_torques]
weight = -2.8e-5

[rewards.dof_vel]
weight = -1.3e-4

[rewards.dof_pos_limits]
weight = -0.3

[rewards.action_rate]
weight = -0.018

[rewards.action_smoothness]
weight = -0.018

[rewards.flat_orientation]
weight = -1.10

[rewards.correct_base_height]
weight = -0.30
[rewards.correct_base_height.params]
target_height = 0.38

[rewards.posture_stability]
weight = -1.0

[rewards.undesired_contacts]
weight = -0.62
[rewards.undesired_contacts.params]
threshold = 1

[rewards.long_non_foot_contact]
weight = -8.0
[rewards.long_non_foot_contact.params]
force_threshold = 5.0
duration_s = 1.0
step_dt = 0.02
max_penalty = 2.0
maze_only = true
maze_goal_dist_gate = 14.0

[rewards.termination]
weight = -9.0

# =============================================================================
# 第二组：足端和楼梯（nav_plan.md 9.3）—— Stage 3 新增
# 帮助机器人在坡地和楼梯上抬脚、稳步态
# =============================================================================
[rewards.feet_air_time]
weight = 0.35
[rewards.feet_air_time.params]
command_name = "base_velocity"
threshold = 0.18

[rewards.feet_clearance]
weight = 0.12
[rewards.feet_clearance.params]
command_name = "base_velocity"
target_height = 0.09
std = 0.05
terrain_height_scale = 0.60
max_terrain_extra_height = 0.08
speed_height_scale = 0.01
body_y_start = 5
body_y_end = 11
near_x_start = 2
near_x_end = 10
delta_quantile = 0.85

[rewards.feet_swing_forward]
weight = 0.05
[rewards.feet_swing_forward.params]
command_name = "base_velocity"
target_forward = 0.11
std = 0.08
min_command = 0.10

[rewards.feet_slide]
weight = -0.12

[rewards.feet_stumble]
weight = -0.07

[rewards.air_time_variance_penalty]
weight = -0.55

[rewards.hip_to_default]
weight = -0.16

[rewards.joint_position_penalty]
weight = -0.11
[rewards.joint_position_penalty.params]
stand_still_scale = 2.0
cmd_threshold = 0.10
ang_cmd_threshold = 0.20

# =============================================================================
# 第三组：目标推进（nav_plan.md 9.4）—— 继承自 navbase
# =============================================================================
[rewards.goal_heading_alignment]
weight = 0.95
[rewards.goal_heading_alignment.params]
std = 0.75

[rewards.goal_velocity_projection]
weight = 2.30
[rewards.goal_velocity_projection.params]
max_speed = 0.80

[rewards.goal_backtrack_penalty]
weight = -3.0
[rewards.goal_backtrack_penalty.params]
deadband = 0.02

[rewards.approach_goal]
weight = 12.5

[rewards.goal_distance]
weight = 0.76
[rewards.goal_distance.params]
scale = 8.0

[rewards.task_complete]
weight = 285.0
[rewards.task_complete.params]
threshold = 0.6

[rewards.navigation_time]
weight = -0.0070

[rewards.backward_penalty]
