# Nav DAgger training configuration (hierarchical high-level policy, Track mode).
# Nav DAgger 训练配置（分层高层策略，Track 模式）。
#
# The frozen low level (command-34728: VisionEncoder + Actor77) drives locomotion at
# 50Hz; the trainable HighLevelPolicy picks a vocabulary token every 10 frames (5Hz)
# and is supervised by a privileged rule-based Oracle (BC -> DAgger linear ramp).
# 冻结低层（command-34728：VisionEncoder + Actor77）以 50Hz 驱动运动；
# 可训练的高层每 10 帧（5Hz）从词表选一个 token，由特权规则 Oracle 监督
# （BC → DAgger 线性 ramp）。
#
# Key points:
#   1. Nav DAgger is not RL — no [rewards] override section; the platform-default
#      Track/Camera env & termination config (already platform-validated) is kept
#      and the scalar reward is simply ignored by the workflow.
#   2. Policy obs = [proprio(45) | height_scan(256) | goal4(4) | depth(57600)] = 57905D
#      Critic obs = [critic_proprio(60) | height_scan(256) | goal3(3)
#                    | nav_priv(4)] = 323D
#      (assembled by NavPolicy/NavCriticObservationProcess; see feature/nav_contract.py)
#   3. Worker-native velocity commands are dead in this stage: curriculum=false,
#      resampling_time=[300,300], worker_progressive disabled. The executed command
#      is injected aisrv-side by NavScheduler into obs[:,6:9] / critic_obs[:,9:12].
# 关键点：
#   1. Nav DAgger 不是 RL —— 不写 [rewards] 覆盖段；保留已过平台验证的
#      Track/Camera 默认环境与终止配置，workflow 忽略标量 reward。
#   2. Policy obs 57905D / Critic obs 323D（布局见 feature/nav_contract.py）。
#   3. worker 原生速度指令在本阶段为死值：curriculum=false、
#      resampling_time=[300,300]、worker_progressive 关闭；实际执行指令由
#      NavScheduler 在 aisrv 侧写入 obs[:,6:9] / critic_obs[:,9:12]。

# Basic Configuration
# 基础配置
[env]
# Fixed after the first platform Track smoke: 128 keeps the validated Camera
# capacity while reducing lifecycle latency and GPU pressure. Do not override
# this silently at runtime.
# 首轮平台 Track smoke 后固定为 128：保持已验证的 Camera 容量，同时降低
# lifecycle 延迟和 GPU 压力；运行时不得静默改写。
num_envs = 128
# Max episode duration (seconds). Fixed by user decision.
# 最大 episode 时长（秒）。用户决定固定 120。
episode_length_s = 120.0
# Legacy field, not consumed by base_env (terrain mode is read from [terrain].mode).
# 遗留字段，base_env 不读取（地形模式由 [terrain].mode 决定）
task = "track"

[env_conf]
# Nav needs the TiledCamera depth sensor -> camera task variant (same as lbc_loco).
# Nav 需要 TiledCamera 深度相机 → 带相机任务变体（与 lbc_loco 相同）。
task_name = "Unitree-Go2-Velocity-Camera"
seed = 0
# Consistency mirror. The actual pre-TOML training selector is
# conf/configure_app.toml [app].policy_entry; this value must match it.
# 一致性镜像：真正在读取本 TOML 之前生效的训练选择器位于
# conf/configure_app.toml [app].policy_entry，两者必须一致。
policy_entry = "nav_dagger"

[custom_parameters]
# Long-horizon workflow maintains per-env done/reset timing itself (same as LBC).
# 长时程 workflow 自己按各环境 done/reset 维护时序（与 LBC 相同）。
continuous_training = true

# Terrain Configuration — Track short chain (round 1)
# 地形配置 —— Track 短链（首轮）
[terrain]
# Terrain mode, valid values: "standard" | "track".
mode = "track"
num_cols = 10
difficulty_range = [0.0, 1.0]
# Nav stage: no worker-command-dependent curriculum (worker cmd is dead here).
# Nav 阶段：关闭依赖 worker 指令的课程机制（worker 指令在本阶段为死值）。
curriculum = false
max_init_terrain_level = 0

[terrain.track]
# Round-1 short chain, maze must be the final segment (user decision).
# 首轮短链，maze 必须在最后一段（用户决定）。
track_length = 2
sub_terrains = ["pyramid_slope", "open_entry_maze"]
# Platform-supported difficulty axis: ten parallel track columns. The old
# [terrain.level_mix] table was not consumed anywhere and has been removed.
# 128 envs are assigned by the native importer; verify the actual long-run
# distribution from nav_probe terrain_types_histogram rather than claiming
# unsupported exact weights.
num_parallel_tracks = 10

# Domain Randomization — round 1 off (control variables; isolate nav learning).
# 域随机化 —— 首轮关闭（控制变量，隔离导航学习本身）。
[domain_rand]
enable_domain_rand = false
randomize_friction = false
friction_range = [0.45, 1.4]
push_robots = false
push_interval_s = 15
max_push_vel_xy = 0.5

[noise]
add_noise = false

[init_state]
pos = [0.0, 0.0, 0.35]

# Velocity Commands — dead in this stage (kept only to satisfy the validator and to
# pin the native sampler inside the frozen low level's trained domain).
# 速度指令 —— 本阶段为死值（保留仅为过校验器 + 把原生采样器钉死在冻结低层的
# 训练域内）。真正执行的指令由 NavScheduler 在 aisrv 侧注入。
[commands]
resampling_time = [300.0, 300.0]

[commands.ranges]
lin_vel_x = [0.3, 1.3]
lin_vel_y = [-0.2, 0.2]
ang_vel_yaw = [-0.3, 0.3]

[commands.limit]
lin_vel_x = [0.3, 1.3]
lin_vel_y = [-0.2, 0.2]
ang_vel_z = [-0.3, 0.3]

[commands.worker_progressive]
enabled = false

# Depth Camera — identical to the validated lbc_loco calibration (21.22° pitch).
# 深度相机 —— 与已验证的 lbc_loco 标定一致（21.22° pitch）。
[camera.depth_camera]
offset_pos = [0.339871, 0.034697, 0.075010]
offset_rot = [0.982631, -0.007085, 0.184337, -0.020153]
max_depth = 5.0

[camera.depth_camera.augmentation]
# Round-1 control variable: off (same as lbc round 1); eval always disables it.
# 首轮控制变量：关闭（与 lbc 首轮一致）；评估模式无条件关闭。
enabled = false
pixel_dropout_prob = 0.10
gaussian_noise_scale = 0.02
roll_range_deg = 10.0
pitch_shift_pix = 10

# Read-only worker probe: full inventory once, then actual terrain level/type
# histograms every 500 steps. It never mutates the environment.
# worker 只读探针：首次打印完整盘点，之后每 500 step 打印真实难度/轨道分布，
# 不修改环境。
[nav_probe]
enabled = true
histogram_interval_steps = 500

# Nav-DAgger-specific parameters (matching NavDaggerConfig; TOML > class default).
# Nav DAgger 专用参数（对应 NavDaggerConfig；TOML 优先于类默认）。
[nav_dagger]
# 冻结低层父模型 ID（用户决定：command-34728）。注入 id == 此值时走首载分支
# （只认低层父候选，高层随机初始化）；换低层重训时改此值即回到首载分支。
low_level_parent_model_id = 34728
learning_rate = 3e-4
lr_min = 1e-5
max_iterations = 20000
max_grad_norm = 1.0
log_interval = 10
# Routine model-pool publication is controlled only by configure_app.toml
# dump_model_freq and the per-frame BaseAgent.learn lifecycle callback. The
# workflow performs one best-effort final save only when training exits.
# 常规模型池发布只由 configure_app.toml 的 dump_model_freq 和逐帧
# BaseAgent.learn 生命周期回调控制；workflow 仅在训练退出时执行一次最终保存。
# One outer iteration = 160 low-level frames = 16 nav ticks = exactly one TBPTT
# segment (T=16, nav_period_frames=10). Keep the three numbers consistent.
# 一个 outer iteration = 160 低层帧 = 16 个 nav tick = 恰好一个 TBPTT 段
# （T=16 × nav_period_frames=10）。三个数字必须保持一致。
num_steps_per_env = 160
tbptt_sequence_length = 16
lr_scheduler_iterations = 14000

# DAgger linear ramp (same semantics as lbc_loco): student-driven ratio grows
# linearly from 0 to 100% over effective training wall-clock hours; soft-stay
# freezes the ratio on quality regression. ramp handled per-env Bernoulli at
# nav-tick granularity. ramp = 0 => Oracle-only idle round (N0 gate).
# DAgger 线性 ramp（语义同 lbc_loco）：学生驱动比例按有效训练墙钟小时数从 0
# 线性升至 100%；质量回退时 soft-stay 冻结比例。按 nav tick 粒度逐环境
# Bernoulli 混合。ramp = 0 即 Oracle 空转轮（N0 门）。
ramp_start_h = 0.50
ramp_end_h = 4.00

# Contract constants mirrored for visibility (authoritative source is
# feature/nav_contract.py; workflow asserts TOML == contract at startup).
# 契约常数镜像（权威来源是 feature/nav_contract.py；workflow 启动时断言
# TOML 与契约一致）。
nav_period_frames = 10
min_dwell_ticks = 10

# No [rewards] section.
# 不配置 [rewards]。
# Nav DAgger is pure supervised learning (token cross-entropy); the platform-default
# Track reward/termination config stays as-is and its scalar reward is ignored.
# Nav DAgger 为纯监督学习（token 交叉熵）；平台默认 Track 奖励/终止配置原样保留，
# 其标量 reward 被 workflow 忽略。
