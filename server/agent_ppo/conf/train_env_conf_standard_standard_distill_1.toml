# standard-distill-1: behavior-distillation bridge from flat Standard 10288.
# Frozen teacher: ActorCritic, actor input proprio45 + height_scan256 = 301.
# Student: ActorCriticEncoder, actor input proprio45 + latent32 = 77.

[env]
num_envs = 1024
episode_length_s = 25.0

[env_conf]
task_name = "Unitree-Go2-Velocity"
seed = 0

[terrain]
mode = "standard"
num_rows = 10
num_cols = 20
difficulty_range = [0.0, 1.0]
curriculum = true
max_init_terrain_level = 3

[terrain.standard.pyramid_slope]
proportion = 0.15

[terrain.standard.pyramid_slope_inv]
proportion = 0.20

[terrain.standard.pyramid_stairs]
proportion = 0.25

[terrain.standard.pyramid_stairs_inv]
proportion = 0.30

[terrain.standard.maze]
proportion = 0.10

[domain_rand]
enable_domain_rand = true
randomize_friction = true
friction_range = [0.3, 1.5]
# Phase 1 learns the new camera geometry and command distribution without
# external pushes. Enable pushes only in a later robustness continuation.
push_robots = false
push_interval_s = 15
max_push_vel_xy = 0.35

[noise]
add_noise = true

[init_state]
pos = [0.0, 0.0, 0.35]

[commands]
resampling_time = [5.0, 10.0]

[commands.limit]
lin_vel_x = [-0.20, 0.65]
lin_vel_y = [-0.15, 0.15]
ang_vel_z = [-1.30, 1.30]

[commands.ranges]
lin_vel_x = [-0.15, 0.30]
lin_vel_y = [-0.10, 0.10]
ang_vel_yaw = [-0.60, 0.60]

[standard_distill_1]
learning_rate = 3e-4
max_iterations = 5000
max_grad_norm = 1.0
log_interval = 50
save_interval = 500
num_steps_per_env = 24
action_loss_weight = 1.0

# Keep teacher-driven states in the first bridge run. Closed-loop student
# recovery is a separate follow-up after action agreement is validated.
student_drive = false
teacher_warmup_iterations = 0
