# STD-D4A-Visual-PPO: fine-tune the best D3A visual student with PPO.
# Actor consumes proprio + depth; Critic consumes the privileged critic tensor.

[env]
num_envs = 128
episode_length_s = 25.0

[env_conf]
task_name = "Unitree-Go2-Velocity-Camera"
seed = 0

[terrain]
mode = "standard"
num_rows = 10
num_cols = 20
difficulty_range = [0.0, 1.0]
curriculum = true
max_init_terrain_level = 4

[terrain.standard.pyramid_slope]
proportion = 0.15

[terrain.standard.pyramid_slope_inv]
proportion = 0.15

[terrain.standard.pyramid_stairs]
proportion = 0.35

[terrain.standard.pyramid_stairs_inv]
proportion = 0.35

[terrain.standard.maze]
proportion = 0.0

[domain_rand]
enable_domain_rand = false
randomize_friction = false
friction_range = [0.3, 1.5]
push_robots = false
push_interval_s = 15
max_push_vel_xy = 0.35

[noise]
add_noise = false

[init_state]
pos = [0.0, 0.0, 0.35]

[commands]
resampling_time = [25.0, 25.0]

[commands.limit]
lin_vel_x = [0.40, 0.60]
lin_vel_y = [0.0, 0.0]
ang_vel_z = [0.0, 0.0]

[commands.ranges]
lin_vel_x = [0.40, 0.60]
lin_vel_y = [0.0, 0.0]
ang_vel_yaw = [0.0, 0.0]

[standard_visual_ppo_1_heading]
learning_rate = 1e-4

# PPO is the primary objective. The frozen D3A action anchor starts very light
# and decays linearly to zero over the first 20 PPO updates.
latent_loss_weight = 0.0
latent_cosine_weight = 0.0
action_loss_weight = 0.05
action_loss_decay_updates = 20

[depth_aug]
enabled = false

[camera.depth_camera]
offset_pos = [0.339871, 0.034697, 0.075010]
offset_rot = [0.982631, -0.007085, 0.184337, -0.020153]

# Velocity tracking and stability baseline inherited from Standard PPO.
[rewards.track_lin_vel_xy]
weight = 2.5
[rewards.track_lin_vel_xy.params]
std = 0.25
command_name = "base_velocity"

[rewards.track_ang_vel_z]
weight = 1.5
[rewards.track_ang_vel_z.params]
std = 0.25
command_name = "base_velocity"

[rewards.straight_heading]
weight = -0.12
[rewards.straight_heading.params]
command_name = "base_velocity"
max_yaw_command = 0.10
min_forward_command = 0.20

[rewards.lin_vel_z]
weight = -0.5

[rewards.ang_vel_xy]
weight = -0.30

[rewards.joint_acc]
weight = -7.5e-7

[rewards.joint_torques]
weight = -1e-4

[rewards.dof_pos_limits]
weight = -0.3

[rewards.action_rate]
weight = -0.015

[rewards.action_smoothness]
weight = -0.0075

[rewards.undesired_contacts]
weight = -0.3
[rewards.undesired_contacts.params]
threshold = 1

[rewards.flat_orientation]
weight = -1.5

[rewards.energy]
weight = -2e-5

[rewards.correct_base_height]
weight = -0.8
[rewards.correct_base_height.params]
target_height = 0.38

[rewards.joint_position_penalty]
weight = -0.3
[rewards.joint_position_penalty.params]
stand_still_scale = 2.0
cmd_threshold = 0.10
ang_cmd_threshold = 0.20

[rewards.feet_air_time]
weight = 1.0
[rewards.feet_air_time.params]
command_name = "base_velocity"
threshold = 0.18

[rewards.feet_slide]
weight = -0.1

[rewards.feet_stumble]
weight = -0.05

[rewards.termination]
weight = -3.0

[rewards.dof_vel]
weight = -3e-4

[rewards.base_lateral_vel]
weight = -0.5

[rewards.air_time_variance_penalty]
weight = -0.8
