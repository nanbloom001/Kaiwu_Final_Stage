# Track teacher -> Unitree-Go2-Velocity-Camera depth-vision LBC stage.
# The platform selects the teacher preload; this stage only saves Camera models.

[env]
num_envs = 128
episode_length_s = 120.0

[env_conf]
task_name = "Unitree-Go2-Velocity-Camera"
seed = 0

[terrain]
mode = "track"
num_rows = 10
num_cols = 10
difficulty_range = [0.0, 1.0]
# Keep initial rollout easy, then let the documented terrain curriculum cover
# all Track evaluator levels rather than sampling one fixed level forever.
curriculum = true
max_init_terrain_level = 0

[terrain.track]
track_length = 5
sub_terrains = ["pyramid_slope", "pyramid_slope_inv", "pyramid_stairs", "pyramid_stairs_inv", "open_entry_maze"]

[domain_rand]
enable_domain_rand = true
randomize_friction = true
friction_range = [0.45, 1.4]
push_robots = false
push_interval_s = 15
max_push_vel_xy = 0.5

[noise]
add_noise = true

[init_state]
pos = [0.0, 0.0, 0.35]

[commands]
resampling_time = [2.5, 4.0]

[commands.limit]
lin_vel_x = [0.0, 1.25]
lin_vel_y = [0.0, 0.0]
ang_vel_z = [-1.2, 1.2]

[commands.ranges]
lin_vel_x = [0.55, 0.80]
lin_vel_y = [0.0, 0.0]
ang_vel_yaw = [0.0, 0.0]

[navigation]
enabled = false

# rl_navigation: terrain-conditioned command gate (root-cause-2 fix).
# Mirrors p22_ref_distill teacher: LBCObservationProcess calls
# apply_worker_gate_command to rewrite obs[6:9] speed by terrain
# (slope 0.80 / stairs 0.70 / maze 0.70). teacher_actor was trained with
# this command distribution; LBC + eval must match, else the frozen actor is
# commanded full-speed on stairs/maze and falls (student test level 3/6/9
# completion=0). eval_phase_command_enabled=false: eval relies on this worker
# gate, not agent-side patching.
[rl_navigation]
phase_command_enabled = true
worker_phase_command_enabled = true
eval_phase_command_enabled = false
gate_test_mode = "sticky"
shadow_selected_gate = "sticky"
terrain_sticky_source = "nan"
gate_speed_advice_enabled = true
gate_reward_metrics_enabled = true
gate_diagnostics_enabled = false
raw_terrain_gate_enabled = true
suggested_speed_fallback = 0.68
pre_maze_lin_vel_x = [0.8, 0.8]
slope_lin_vel_x = [0.80, 0.80]
stairs_lin_vel_x = [0.70, 0.70]
maze_lin_vel_x = [0.70, 0.70]
phase_maze_goal_dist_gate = 8.5
phase_maze_distance_mode = "longitudinal"
phase_maze_goal_longitudinal_min = -1.0
phase_maze_confirm_steps = 3
phase_maze_release_margin = 2.0
phase_maze_sticky_until_done = true
phase_command_resample_steps = 160
terrain_phase_speed_enabled = true
terrain_sticky_confirm_steps = 4
terrain_sticky_flat_release_steps = 10
terrain_sticky_slope_hold_steps = 30
terrain_sticky_stairs_hold_steps = 25
terrain_sticky_wall_hold_steps = 40
terrain_flat_release_edge_max = 0.025
terrain_flat_release_delta_max = 0.025
terrain_flat_release_pitch_max = 0.10
terrain_updown_full_delta = 0.12
fused_gate_stair_edge_threshold = 0.040
fused_gate_stair_locality_threshold = 0.30
fused_gate_stair_smoothness_max = 0.45
fused_gate_slope_edge_mean_min = 0.006
fused_gate_slope_smoothness_min = 0.60
fused_gate_slope_edge_max = 0.080
fused_gate_wall_edge_threshold = 0.30
fused_gate_direction_margin = 0.02
nan_gate_body_y_start = 5
nan_gate_body_y_end = 11
nan_gate_x_start = 0
nan_gate_x_end = 10
nan_gate_stair_edge_threshold = 0.040
nan_gate_stair_locality_threshold = 0.30
nan_gate_stair_smoothness_max = 0.45
nan_gate_slope_edge_mean_min = 0.006
nan_gate_slope_smoothness_min = 0.60
nan_gate_slope_edge_max = 0.070
nan_gate_wall_edge_threshold = 0.30
nan_gate_direction_margin = 0.02
nav_gate_wall_edge_threshold = 0.30
nav_wall_body_y_start = 3
nav_wall_body_y_end = 10
nav_wall_front_cols = 6
nav_wall_side_width = 3
nav_wall_height_threshold = 0.24
nav_wall_temperature = 0.08
nav_wall_score_threshold = 0.35
nav_wall_floor_quantile = 0.20
nav_wall_gate_in_maze_only = true

[p22_lbc_loco]
learning_rate = 5e-4
max_iterations = 15000  # ~9.3h at ~2.3s/iter, fits 10h budget with buffer (was 10000=6h13min)
max_grad_norm = 1.0
log_interval = 100
save_interval = 1000
num_steps_per_env = 24
# Actual temporal credit assignment length.  Eight steps keeps 180x320 camera
# batches within practical memory; raise only after verifying VRAM headroom.
bptt_steps = 8
student_drive = true
# DAgger (root-cause-1): teacher warmup then student drives closed-loop
teacher_warmup_iterations = 300
# action-level distillation weight (root-cause-1 fix); 0=off
action_loss_weight = 0.2
# p_student annealing: anneal 0->1 over first anneal_fraction (post-warmup), hold 1 for rest (full closed-loop)
p_student_anneal_fraction = 0.5

[depth_aug]
# Applied only while lbc_workflow sets env._is_training=true; eval is clean.
enabled = true
pixel_dropout_prob = 0.10
gaussian_noise_scale = 0.02
edge_dropout_prob = 0.10
hole_patch_prob = 0.20
hole_patch_size = [4, 16]
hole_hold_steps = [2, 8]
frame_hold_prob = 0.10
frame_hold_steps = [1, 5]
blur_kernel_size = 3
roll_range_deg = 5.0
pitch_shift_pix = 6

[camera.depth_camera]
# 外参覆盖：对齐测试/部署 env 的深度相机位姿，消除训练-测试相机外参不一致。
offset_pos = [0.339871, 0.034697, 0.075010]
offset_rot = [0.982631, -0.007085, 0.184337, -0.020153]
