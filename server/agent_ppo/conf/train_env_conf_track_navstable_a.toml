[env]
num_envs = 3072
episode_length_s = 120.0

[env_conf]
seed = 0

# Stage 3A: Nav Stable A — 完整赛道低速适应（对应复赛 xtrack3）
# 目标：在完整 5 段赛道上低速稳定行走，不破坏 Stage2 已有导航能力
# 关键：低速 [0.45,0.65]、不提速、不开门控、低探索噪声
# 预训练来源：navbase 产物（t01）
# 晋级条件：Level0/3 稳定完成、Level6 不全为0、单迷宫能力保持
[terrain]
mode = "track"
num_rows = 10
num_cols = 10
difficulty_range = [0.0, 0.6]
curriculum = true
max_init_terrain_level = 0

[terrain.track]
track_length = 5
sub_terrains = ["pyramid_slope", "pyramid_slope_inv", "pyramid_stairs", "pyramid_stairs_inv", "open_entry_maze"]

[domain_rand]
enable_domain_rand = true
randomize_friction = true
friction_range = [0.45, 1.4]
push_robots = false
push_interval_s = 15
max_push_vel_xy = 0.5

[noise]
add_noise = true

[init_state]
pos = [0.0, 0.0, 0.35]

# 低速：保持 Stage2 水平，不提速
[commands]
resampling_time = [2.5, 4.0]

[commands.limit]
lin_vel_x = [0.0, 0.8]
lin_vel_y = [-0.0, 0.0]
ang_vel_z = [-1.2, 1.2]

[commands.ranges]
lin_vel_x = [0.45, 0.65]
lin_vel_y = [0.0, 0.0]
ang_vel_yaw = [0.0, 0.0]

[navigation]
enabled = false

# Stage3A 不开门控（门控是 Stage3B 的事）
[rl_navigation]
phase_command_enabled = false
worker_phase_command_enabled = false
gate_speed_advice_enabled = false
gate_reward_metrics_enabled = false
eval_command_override = true
eval_command = [0.45, 0.0, 0.0]

# =============================================================================
# 第一组：运控保持（防止破坏 Stage2 步态和导航能力）
# =============================================================================
[rewards.track_lin_vel_xy]
weight = 1.08
[rewards.track_lin_vel_xy.params]
std = 0.24
command_name = "base_velocity"

[rewards.track_ang_vel_z]
weight = 0.045
[rewards.track_ang_vel_z.params]
std = 0.35
command_name = "base_velocity"

[rewards.lin_vel_z]
weight = -0.60

[rewards.ang_vel_xy]
weight = -0.55

[rewards.flat_orientation]
weight = -1.10

[rewards.correct_base_height]
weight = -0.30
[rewards.correct_base_height.params]
target_height = 0.38

[rewards.posture_stability]
weight = -1.0

[rewards.action_rate]
weight = -0.018

[rewards.action_smoothness]
weight = -0.018

[rewards.joint_torques]
weight = -2.8e-5

[rewards.undesired_contacts]
weight = -0.62
[rewards.undesired_contacts.params]
threshold = 1

[rewards.termination]
weight = -9.0

# =============================================================================
# 第二组：基础导航（Stage2 已有能力，保持不退化）
# =============================================================================
[rewards.goal_heading_alignment]
weight = 0.95
[rewards.goal_heading_alignment.params]
std = 0.75

[rewards.goal_velocity_projection]
weight = 2.30
[rewards.goal_velocity_projection.params]
max_speed = 0.80

[rewards.goal_backtrack_penalty]
weight = -3.0
[rewards.goal_backtrack_penalty.params]
deadband = 0.02

[rewards.approach_goal]
weight = 12.5

[rewards.task_complete]
weight = 285.0
[rewards.task_complete.params]
threshold = 0.6

[rewards.navigation_time]
weight = -0.0070

[rewards.backward_penalty]
weight = -2.5
[rewards.backward_penalty.params]
deadband = 0.03
