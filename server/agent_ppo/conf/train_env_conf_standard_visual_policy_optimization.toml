# Standard Stage 5: constrained recurrent visual PPO from S0_visual_lbc.
# Parent checkpoint: model.ckpt-visionfull-28401.pkl.

[env]
num_envs = 128
episode_length_s = 25
task = "standard"

[env_conf]
task_name = "Unitree-Go2-Velocity-Camera"
seed = 0

[custom_parameters]
continuous_training = true

[terrain]
mode = "standard"
num_rows = 10
num_cols = 20
difficulty_range = [0.0, 1.0]
curriculum = true
max_init_terrain_level = 9

[terrain.standard_wall]
enabled = true
min_difficulty = 0.60
full_difficulty = 0.90
max_probability = 0.15
height_range = [0.25, 0.45]
thickness_range = [0.10, 0.15]
margin_range = [0.05, 0.10]
eligible_keywords = ["slope", "stairs"]
exclude_keywords = ["maze", "corridor"]

[terrain.standard.pyramid_slope]
proportion = 0.20

[terrain.standard.pyramid_slope_inv]
proportion = 0.20

[terrain.standard.pyramid_stairs]
proportion = 0.20

[terrain.standard.pyramid_stairs_inv]
proportion = 0.40

[terrain.standard.maze]
proportion = 0.0
platform_width = 3.0

[domain_rand]
enable_domain_rand = false
randomize_friction = false
friction_range = [0.3, 1.5]
push_robots = false
push_interval_s = 15
max_push_vel_xy = 0.5

[noise]
add_noise = false

[init_state]
pos = [0.0, 0.0, 0.35]

[commands]
# Isaac's uniform resampler is effectively disabled. base_env writes the
# explicit bounded bucket samples below into the same base_velocity command.
resampling_time = [1000000.0, 1000000.0]

[commands.ranges]
lin_vel_x = [0.0, 0.7]
lin_vel_y = [-0.2, 0.2]
ang_vel_yaw = [-0.3, 0.3]

[commands.limit]
lin_vel_x = [0.0, 0.7]
lin_vel_y = [-0.2, 0.2]
ang_vel_z = [-0.3, 0.3]

[commands.buckets]
enabled = true
hold_time_s = [3.0, 6.0]
zero_weight = 0.25
low_forward_weight = 0.25
normal_forward_weight = 0.25
forward_yaw_weight = 0.15
lateral_weight = 0.10

[visual_policy_optimization]
max_iterations = 50000
num_steps_per_env = 48
tbptt_sequence_length = 16
num_learning_epochs = 5
num_mini_batches = 4
actor_learning_rate = 3.0e-5
lstm_learning_rate = 3.0e-5
critic_learning_rate = 3.0e-4
max_grad_norm = 1.0
init_noise_std = 0.15

# One platform task performs the three phases. The platform controls the
# actual three-hour deadline; max_iterations is only a high safety ceiling.
critic_only_hours = 0.5
actor_only_end_hours = 1.5
task_end_hours = 3.0
action_anchor_start = 1.0
action_anchor_mid = 0.5
action_anchor_end = 0.2
latent_anchor_weight = 0.1
max_anchor_action_mse = 0.05
max_hard_termination_delta = 0.02
save_interval_minutes = 10.0
log_interval = 10

[camera.depth_camera]
offset_pos = [0.339871, 0.034697, 0.075010]
offset_rot = [0.982631, -0.007085, 0.184337, -0.020153]
max_depth = 5.0

[camera.depth_camera.augmentation]
enabled = false
pixel_dropout_prob = 0.10
gaussian_noise_scale = 0.02
roll_range_deg = 10.0
pitch_shift_pix = 10

# Standard locomotion reward surface, with the dense forward-only reward
# disabled so speed tracking and stop commands cannot be overridden by a
# generic "move fast" incentive.
[rewards.track_lin_vel_xy]
weight = 3.0
[rewards.track_lin_vel_xy.params]
std = 0.25
command_name = "base_velocity"

[rewards.track_ang_vel_z]
weight = 1.0
[rewards.track_ang_vel_z.params]
std = 0.25
command_name = "base_velocity"

[rewards.forward_velocity]
weight = 0.0

[rewards.air_time_variance_penalty]
weight = -3.0

[rewards.max_foot_air_time]
weight = -3.0
[rewards.max_foot_air_time.params]
threshold = 0.8

[rewards.foot_symmetry]
weight = -2.0
[rewards.foot_symmetry.params]
max_diff = 0.2

[rewards.trot_gait]
weight = -1.0

[rewards.hip_to_default]
weight = -0.1

[rewards.dof_pos_limits]
weight = -0.3

[rewards.joint_acc]
weight = -1.0e-6

[rewards.joint_position_penalty]
weight = -0.1
[rewards.joint_position_penalty.params]
stand_still_scale = 5.0
velocity_threshold = 0.1

[rewards.feet_air_time]
weight = 0.5
[rewards.feet_air_time.params]
command_name = "base_velocity"
threshold = 0.1

[rewards.feet_regulation]
weight = -0.05
[rewards.feet_regulation.params]
base_height_target = 0.38

[rewards.feet_contact_forces]
weight = -0.01
[rewards.feet_contact_forces.params]
max_force = 147.0

[rewards.feet_slide]
weight = -0.05

[rewards.feet_stumble]
weight = -0.1

[rewards.legs_distance]
weight = -0.1
[rewards.legs_distance.params]
min_distance = 0.1

[rewards.x_command_hip_regular]
weight = -0.1

[rewards.approach_goal]
weight = 2.0

[rewards.reach_goal]
weight = 10.0
[rewards.reach_goal.params]
threshold = 0.6
