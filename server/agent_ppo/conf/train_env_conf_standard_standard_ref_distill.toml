# Standard reference behavior distillation.
# 先把成熟扁平 standard teacher 蒸馏成主线 ActorCriticEncoder locomotion ckpt。

[env]
num_envs = 1024
episode_length_s = 25

[env_conf]
task_name = "Unitree-Go2-Velocity"
seed = 0

[terrain]
mode = "standard"
num_rows = 10
num_cols = 20
difficulty_range = [0.0, 1.0]
curriculum = true
max_init_terrain_level = 9

[terrain.standard.pyramid_slope]
proportion = 0.20

[terrain.standard.pyramid_slope_inv]
proportion = 0.20

[terrain.standard.pyramid_stairs]
proportion = 0.20

[terrain.standard.pyramid_stairs_inv]
proportion = 0.40

[terrain.standard.maze]
proportion = 0.0

[domain_rand]
enable_domain_rand = false
randomize_friction = false
friction_range = [0.3, 1.5]
push_robots = false
push_interval_s = 15
max_push_vel_xy = 0.5

[noise]
add_noise = false

[init_state]
pos = [0.0, 0.0, 0.35]

[commands]
resampling_time = [6.0, 10.0]

[commands.limit]
lin_vel_x = [0.3, 1.3]
lin_vel_y = [-0.2, 0.2]
ang_vel_z = [-0.3, 0.3]

[commands.ranges]
lin_vel_x = [0.3, 1.3]
lin_vel_y = [-0.2, 0.2]
ang_vel_yaw = [-0.3, 0.3]

[standard_ref_distill]
# 默认不写 teacher_ckpt；训练启动页选择 hjcnew8 预训练模型后，
# 平台会通过 Agent.load_model(...) 把该 ckpt 注入为 frozen teacher。
# 只有本地离线调试时，才手动添加 teacher_ckpt = "..."
learning_rate = 3e-4
max_iterations = 6000
num_steps_per_env = 24
log_interval = 10
save_interval = 100
max_grad_norm = 1.0
action_loss_weight = 1.0
quality_window_iterations = 50
phase_labels = [
  "daggerzero",
  "daggerquarter",
  "daggerhalf",
  "daggerthreequarter",
  "daggerfull",
]
student_drive_ratios = [0.0, 0.25, 0.50, 0.75, 1.0]
phase_min_iterations = [900, 600, 600, 600, 1800]
phase_max_iterations = [1500, 900, 900, 900, 6000]

[standard_ref_distill.quality_thresholds]
minimum_action_cosine = 0.98
maximum_normalized_action_mse = 0.10
maximum_safety_takeover_rate = 0.10
maximum_hard_termination_delta = 0.01

[standard_ref_distill.safety]
minimum_action_l2_threshold = 0.25
p95_multiplier = 2.0

[standard_ref_distill.replay]
capacity = 8192
batch_size = 256
loss_ratio = 0.25
add_per_step = 64

[standard_ref_distill.command_guard]
lin_vel_x = [0.3, 1.3]
lin_vel_y = [-0.2, 0.2]
ang_vel_z = [-0.3, 0.3]
tolerance = 1e-5
