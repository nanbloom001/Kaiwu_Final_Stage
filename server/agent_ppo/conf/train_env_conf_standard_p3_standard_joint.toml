# P3.5 Standard 8-hour low-speed gait, camera timing and late-push repair.
[env]
num_envs = 128
episode_length_s = 40.0
task = "standard"
[env_conf]
task_name = "Unitree-Go2-Velocity-Camera"
policy_entry = "p3_standard_joint"
seed = 0
[custom_parameters]
continuous_training = true

[terrain]
mode = "standard"
num_rows = 10
num_cols = 20
difficulty_range = [0.0, 1.0]
curriculum = false
max_init_terrain_level = 9
[terrain.standard_wall]
enabled = false
[terrain.standard.pyramid_slope]
proportion = 0.15
[terrain.standard.pyramid_slope_inv]
proportion = 0.15
[terrain.standard.pyramid_stairs]
proportion = 0.35
[terrain.standard.pyramid_stairs_inv]
proportion = 0.35
[terrain.standard.maze]
proportion = 0.0
platform_width = 3.0

[domain_rand]
enable_domain_rand = true
randomize_friction = true
friction_range = [0.65, 1.25]
randomize_base_mass = true
added_mass_range = [-0.40, 0.40]
push_robots = true
push_interval_s = 30.0
min_push_interval_s = 17.0
max_push_vel_xy = 0.0
restitution_range = [0.0, 0.05]
[noise]
add_noise = true
noise_level = 0.35
[init_state]
pos = [0.0, 0.0, 0.35]

[commands]
resampling_time = [300.0, 300.0]
heading_command = false
[commands.ranges]
lin_vel_x = [0.0, 1.0]
lin_vel_y = [-0.30, 0.30]
ang_vel_yaw = [-0.90, 0.90]
[commands.limit]
lin_vel_x = [0.0, 1.0]
lin_vel_y = [-0.30, 0.30]
ang_vel_z = [-0.90, 0.90]
[commands.worker_progressive]
enabled = true
log_interval_steps = 500

[camera.depth_camera]
offset_pos = [0.339871, 0.034697, 0.075010]
offset_rot = [0.982631, -0.007085, 0.184337, -0.020153]
max_depth = 5.0
[camera.depth_camera.augmentation]
enabled = false

[p3_standard_joint]
run_name = "p35gaitfix8h"
schedule_mode = "p35_gaitfix_v1"
parent_model_id = 1013548
parent_model_label = "p3stairmem8h-stairfinal-1013548"
parent_source_task_id = 235689
parent_checkpoint_sha256 = "574924419ccd58923ccb5b6b2b29a88464ca2744e06bc888b7c7f5021f75250a"
load_mode = "p35_fixed_parent_warm_start"
task_end_hours = 8.0
target_effective_seconds = 28800
max_iterations = 200000
num_steps_per_env = 128
tbptt_sequence_length = 128
num_learning_epochs = 4
num_mini_batches = 4
actor_learning_rate = 3.0e-6
lstm_learning_rate = 1.5e-6
critic_learning_rate = 3.0e-5
max_grad_norm = 1.0
init_noise_std = 0.15
first_save_minutes = 5.0
save_interval_minutes = 10.0
log_interval = 5
mirror_seed = 3197
depth_fault_seed = 3329
memory_seed = 3331
p35_baseline_seed = 3373
subgoal_seed = 3107
milestone_success_reward = 1.5
m3_success_reward = 15.0
subgoal_timeout_penalty = -0.5
subgoal_time_limit_s = [6.0, 12.0]
milestone_1_radius_m = [1.3, 1.6]
milestone_2_radius_m = [2.5, 2.9]
subgoal_success_distance_m = 0.5
terrain_size_x_m = 8.0
platform_complete_margin_m = 0.10
m3_target_overshoot_m = 0.03
m3_boundary_margin_m = 0.03
replan_angle_offsets_deg = [-60.0, -30.0, 30.0, 60.0]
tile_inner_margin_m = 1.0
tile_reset_local_abs_m = 3.2

[p3_standard_joint.command_schedule]
seed = 3187
step_dt_s = 0.02
target_hold_s = [2.0, 8.0]
zero_hold_s = [2.0, 4.0]
# Keep the reverse slot as a wire/checkpoint compatibility placeholder.  The
# active high-level contract cannot issue negative vx, so P3 does not spend
# low-level recovery samples on an unreachable command domain.
bucket_weights = [0.25, 0.00, 0.10, 0.35, 0.08, 0.15, 0.07]

[p3_standard_joint.response_adapter]
learning_rate = 5.0e-6
calibration_learning_rate = 1.0e-5
high_adapt_learning_rate = 1.0e-5
max_grad_norm = 0.5
capacity_steps = 4096
sequence_length = 16
burn_in_steps = 8
batch_envs = 64
updates_per_iteration = 1
calibration_updates_per_iteration = 4
high_update_interval = 2
velocity_loss_weight = 1.0
pose_loss_weight = 0.5
stuck_loss_weight = 0.25
nll_loss_weight = 0.1
velocity_horizon_weights = [1.0, 0.75, 0.5]

[p3_standard_joint.domain_randomization]
friction_range = [0.65, 1.25]
base_added_mass_kg = 0.40
noise_level = 0.35
restitution_range = [0.00, 0.05]
push_robots = true
min_push_interval_s = 17.0
push_interval_s = 30.0

[p3_standard_joint.camera_timing]
capture_rate_hz = 30.0
control_rate_hz = 50.0
feature_fifo_frames = 10
active_delay_max_ms = 150.0
shadow_delay_max_ms = 250.0
capture_phase_seed = 3361

[p3_standard_joint.push_schedule]
term_name = "push_robot"
warm_start_s = 14400.0
full_start_s = 21600.0
warm_max_velocity_xy_m_s = 0.04
full_max_velocity_xy_m_s = 0.05
warm_min_interval_s = 20.0
warm_max_interval_s = 30.0
full_min_interval_s = 17.0
full_max_interval_s = 27.0
resume_offset_s = 0.0

