# P3 Standard 2.5-hour Sim2Real and radial-navigation recovery.
[env]
num_envs = 128
episode_length_s = 25.0
task = "standard"
[env_conf]
task_name = "Unitree-Go2-Velocity-Camera"
policy_entry = "p3_standard_joint"
seed = 0
[custom_parameters]
continuous_training = true

[terrain]
mode = "standard"
num_rows = 10
num_cols = 20
difficulty_range = [0.0, 1.0]
curriculum = false
max_init_terrain_level = 9
[terrain.standard_wall]
enabled = false
[terrain.standard.pyramid_slope]
proportion = 0.20
[terrain.standard.pyramid_slope_inv]
proportion = 0.20
[terrain.standard.pyramid_stairs]
proportion = 0.30
[terrain.standard.pyramid_stairs_inv]
proportion = 0.30
[terrain.standard.maze]
proportion = 0.0
platform_width = 3.0

[domain_rand]
enable_domain_rand = true
randomize_friction = true
friction_range = [0.6, 1.3]
randomize_base_mass = true
added_mass_range = [-0.75, 0.75]
push_robots = false
push_interval_s = 15.0
max_push_vel_xy = 0.30
[noise]
add_noise = true
noise_level = 0.50
[init_state]
pos = [0.0, 0.0, 0.35]

[commands]
resampling_time = [300.0, 300.0]
heading_command = false
[commands.ranges]
lin_vel_x = [-0.25, 1.0]
lin_vel_y = [-0.30, 0.30]
ang_vel_yaw = [-0.90, 0.90]
[commands.limit]
lin_vel_x = [-0.25, 1.0]
lin_vel_y = [-0.30, 0.30]
ang_vel_z = [-0.90, 0.90]
[commands.worker_progressive]
enabled = true
log_interval_steps = 500

[camera.depth_camera]
offset_pos = [0.339871, 0.034697, 0.075010]
offset_rot = [0.982631, -0.007085, 0.184337, -0.020153]
max_depth = 5.0
[camera.depth_camera.augmentation]
enabled = false

[p3_standard_joint]
run_name = "p3std2h30-gait-radial"
schedule_mode = "p3_low_recovery_v1"
parent_model_id = 884257
parent_model_label = "p3nav8h-r1"
load_mode = "p3_radial_warm_start"
task_end_hours = 2.5
target_effective_seconds = 9000
max_iterations = 200000
num_steps_per_env = 80
tbptt_sequence_length = 16
num_learning_epochs = 5
num_mini_batches = 4
actor_learning_rate = 1.0e-5
lstm_learning_rate = 5.0e-6
critic_learning_rate = 1.0e-4
max_grad_norm = 1.0
init_noise_std = 0.15
first_save_minutes = 5.0
save_interval_minutes = 10.0
log_interval = 5
mirror_seed = 3197
subgoal_seed = 3107
milestone_success_reward = 1.5
m3_success_reward = 15.0
subgoal_timeout_penalty = -0.5
subgoal_time_limit_s = [6.0, 12.0]
milestone_1_radius_m = [1.3, 1.6]
milestone_2_radius_m = [2.5, 2.9]
subgoal_success_distance_m = 0.5
terrain_size_x_m = 8.0
platform_complete_margin_m = 0.10
m3_target_overshoot_m = 0.03
m3_boundary_margin_m = 0.03
replan_angle_offsets_deg = [-60.0, -30.0, 30.0, 60.0]
tile_inner_margin_m = 1.0
tile_reset_local_abs_m = 3.2

[p3_standard_joint.command_schedule]
step_dt_s = 0.02
target_hold_s = [2.0, 8.0]
zero_hold_s = [2.0, 4.0]
bucket_weights = [0.25, 0.15, 0.20, 0.15, 0.10, 0.10, 0.05]

[p3_standard_joint.response_adapter]
learning_rate = 3.0e-5
calibration_learning_rate = 3.0e-5
high_adapt_learning_rate = 1.0e-5
max_grad_norm = 0.5
capacity_steps = 4096
sequence_length = 16
burn_in_steps = 8
batch_envs = 64
updates_per_iteration = 1
calibration_updates_per_iteration = 4
high_update_interval = 2
velocity_loss_weight = 1.0
pose_loss_weight = 0.5
stuck_loss_weight = 0.25
nll_loss_weight = 0.1
velocity_horizon_weights = [1.0, 0.75, 0.5]

[p3_standard_joint.domain_randomization]
phase_hours = [0.0, 0.5, 2.5]
friction_ranges = [[0.60, 1.30], [0.55, 1.35]]
base_added_mass_kg = [0.75, 0.85]
noise_levels = [0.50, 0.55]

[rewards.track_lin_vel_xy]
weight = 2.5
[rewards.track_lin_vel_xy.params]
std = 0.22
command_name = "base_velocity"
[rewards.track_ang_vel_z]
weight = 1.25
[rewards.track_ang_vel_z.params]
std = 0.25
command_name = "base_velocity"
[rewards.feet_air_time]
weight = 0.0
[rewards.flat_orientation]
weight = -0.05
[rewards.p3_posture_stability]
weight = -0.25
[rewards.p3_posture_stability.params]
raw_cap = 0.24
[rewards.energy]
weight = -1.2e-5
[rewards.p3_sim2real_cost]
weight = -1.0
[rewards.p3_sim2real_cost.params]
sustained_weight = 0.06
peak_weight = 0.02
action_rate_weight = 0.04
action_jerk_weight = 0.015
frame_cap = 0.12
ema_window_s = 0.20
[rewards.undesired_contacts]
weight = -0.30
[rewards.undesired_contacts.params]
threshold = 1
[rewards.air_time_variance_penalty]
weight = 0.0
[rewards.max_continuous_air_time_penalty]
weight = 0.0
[rewards.max_continuous_air_time_penalty.params]
soft_limit_s = 0.55
hard_limit_s = 1.20
[rewards.contact_duty_factor_symmetry]
weight = 0.0
[rewards.contact_duty_factor_symmetry.params]
ema_tau_s = 1.0
full_symmetry_wz = 0.15
minimum_scale = 0.25
[rewards.foot_contact_participation]
weight = 0.0
[rewards.foot_contact_participation.params]
ema_tau_s = 1.0
minimum_duty_factor = 0.12
[rewards.max_foot_air_time]
weight = 0.0
[rewards.max_foot_air_time.params]
threshold = 0.8
[rewards.foot_symmetry]
weight = 0.0
[rewards.foot_symmetry.params]
max_diff = 0.2
[rewards.trot_gait]
weight = 0.0
[rewards.joint_acc]
weight = -1.25e-6
[rewards.joint_position_penalty]
weight = -0.1
[rewards.joint_position_penalty.params]
stand_still_scale = 2.0
velocity_threshold = 0.1
