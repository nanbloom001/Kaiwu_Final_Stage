# P4 stable-direction 30-minute reward-credit smoke over the verified parent.

[env]
num_envs = 128
episode_length_s = 75.0
task = "track"

[env_conf]
task_name = "Unitree-Go2-Velocity-Camera"
policy_entry = "p4_nav_ppo"
seed = 0

[custom_parameters]
continuous_training = true

[terrain]
mode = "track"
num_cols = 20
difficulty_range = [0.0, 1.0]
curriculum = false
max_init_terrain_level = 0

[terrain.track]
track_length = 1
sub_terrains = ["open_entry_maze"]
num_parallel_tracks = 20

[domain_rand]
enable_domain_rand = false
randomize_friction = false
friction_range = [1.0, 1.0]
randomize_base_mass = false
added_mass_range = [0.0, 0.0]
restitution_range = [0.0, 0.0]
# Keep the attribution run free from external disturbances.
push_robots = false
push_interval_s = 45.0
min_push_interval_s = 30.0
max_push_vel_xy = 0.0

[noise]
add_noise = false
noise_level = 0.0

[init_state]
pos = [0.0, 0.0, 0.35]

[commands]
resampling_time = [300.0, 300.0]
heading_command = false

[commands.ranges]
lin_vel_x = [0.0, 1.0]
lin_vel_y = [-0.30, 0.30]
ang_vel_yaw = [-0.90, 0.90]

[commands.limit]
lin_vel_x = [0.0, 1.0]
lin_vel_y = [-0.30, 0.30]
ang_vel_z = [-0.90, 0.90]

[commands.worker_progressive]
enabled = false

[camera.depth_camera]
offset_pos = [0.339871, 0.034697, 0.075010]
offset_rot = [0.982631, -0.007085, 0.184337, -0.020153]
max_depth = 5.0

[camera.depth_camera.augmentation]
enabled = false

[p4_nav_ppo]
run_name = "p4maze30m-stable-smoke"
# Model ID selects the intended parent candidate; structure/spec/shape/finite
# validation remains authoritative after selection.
parent_model_id = 1416926
parent_model_label = "p4maze8h10hz_1416926-mazefinal"
training_profile = "maze_stable_direction_smoke"
# All 1,800 seconds are effective training. The 0.25 hour margin is reserved
# for checkpoint/save/normal shutdown only.
task_end_hours = 0.75
target_effective_seconds = 1800
diagnostic_seconds = 0
maze_training_branch = "stable_direction_smoke"
nav_rollout_ticks = 32
nav_period_frames = 5
tbptt_sequence_length = 16
num_learning_epochs = 4
num_mini_batches = 4
cnn_microbatch_sequences = 4
max_grad_norm = 1.0
command_transition_mode = "instant_hold_10hz"
hold_frames = 5
first_save_minutes = 5.0
save_interval_minutes = 10.0
log_interval = 1
p4_seed = 4100
adapter_seed = 4104
ppo_seed = 4105
neutral_seed = 4106
action_seed = 4107
vy_action_seed = 4108
terrain_curriculum = false
camera_fault_course_enabled = false
goal_fault_course_enabled = false

[p4_nav_ppo.stuck_reset]
enabled = true
mode = "shadow"
schedule_enabled = false
confirmation_s = 12.0
initial_confirmation_s = 12.0
activation_delay_s = 0.0
tighten_after_s = 7200.0
resume_offset_s = 0.0
radius_m = 0.30
min_goal_distance_m = 0.80
body_collision_force_n = 30.0
wall_evidence_latch_s = 2.0
episode_grace_s = 5.0
push_grace_s = 2.0
max_true_motion_speed_m_s = 0.08
terminal_penalty = -75.0

[p4_nav_ppo.full_track_spawn]
enabled = false
phase_boundaries_s = [7200.0, 21600.0]
full_start_share = [0.70, 0.60, 0.75]
random_segment_weights = [0.15, 0.15, 0.20, 0.20, 0.30]
safe_point_share = 0.70
quartiles = 4
slope_yaw_abs = 0.35
maze_yaw_abs = 0.50
max_reason4_same_bucket_retries = 2
segment_length_m = 8.0

[p4_nav_ppo.push_schedule]
term_name = "push_robot"
resume_offset_s = 0.0

[p4_nav_ppo.near_goal_capture]
# Diagnostic only. It must not rewrite the sampled policy command.
enabled = false
freshness_min = 0.90
distance_m = [0.65, 1.20]
policy_goal_cosine_min = 0.70

[p4_nav_ppo.response_adapter]
learning_rate = 2.5e-6
max_grad_norm = 0.5
capacity_steps = 4096
sequence_length = 16
burn_in_steps = 8
batch_envs = 64
velocity_loss_weight = 1.0
pose_loss_weight = 0.5
stuck_loss_weight = 0.25
nll_loss_weight = 0.1
velocity_horizon_weights = [1.0, 0.75, 0.5]
target_stability_tolerance = [0.05, 0.02, 0.08]

[p4_nav_ppo.feedback_profile]
version = "p15_feedback_v2"
age_clip_s = 0.8
complete_failure_probability = 0.015
complete_failure_duration_s = [0.10, 0.60]
short_horizon_velocity_sources = ["sport_mode_xy", "imu_gyro_z"]
uwb_role = "long_horizon_only_not_in_response_observation"

[p4_nav_ppo.feedback_profile.sport]
rate_hz = [35.0, 50.0]
delay_s = [0.0, 0.06]
noise_std = [0.025, 0.025, 0.035]
bias_std = [0.015, 0.015, 0.020]
dropout_probability = [0.0, 0.08]
freshness_timeout_s = [0.10, 0.22]

[p4_nav_ppo.feedback_profile.uwb]
rate_hz = [4.0, 6.0]
delay_s = [0.08, 0.30]
noise_std = [0.06, 0.06, 0.05]
bias_std = [0.03, 0.03, 0.02]
low_pass_tau_s = [0.18, 0.45]
dropout_probability = [0.0, 0.18]
freshness_timeout_s = [0.30, 0.70]

[p4_nav_ppo.feedback_profile.imu]
gyro_noise_std = [0.006, 0.006, 0.009]
gyro_bias_std = [0.004, 0.004, 0.006]
gravity_noise_std = 0.004

[rewards.flat_orientation]
weight = -0.05

[rewards.energy]
weight = -5.0e-6

[rewards.undesired_contacts]
weight = 0.0
[rewards.undesired_contacts.params]
threshold = 1

[rewards.track_lin_vel_xy]
weight = 0.0
[rewards.track_lin_vel_xy.params]
std = 0.25
command_name = "base_velocity"

[rewards.track_ang_vel_z]
weight = 0.0
[rewards.track_ang_vel_z.params]
std = 0.25
command_name = "base_velocity"
