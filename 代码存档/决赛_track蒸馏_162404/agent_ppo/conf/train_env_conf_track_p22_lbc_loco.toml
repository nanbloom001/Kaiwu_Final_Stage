# Track teacher -> Unitree-Go2-Velocity-Camera depth-vision LBC stage.
# The platform selects the teacher preload; this stage only saves Camera models.

[env]
num_envs = 128
episode_length_s = 120.0

[env_conf]
task_name = "Unitree-Go2-Velocity-Camera"
seed = 0

[terrain]
mode = "track"
num_rows = 10
num_cols = 10
difficulty_range = [0.0, 1.0]
curriculum = false
max_init_terrain_level = 0

[terrain.track]
track_length = 5
sub_terrains = ["pyramid_slope", "pyramid_slope_inv", "pyramid_stairs", "pyramid_stairs_inv", "open_entry_maze"]

[domain_rand]
enable_domain_rand = true
randomize_friction = true
friction_range = [0.45, 1.4]
push_robots = false
push_interval_s = 15
max_push_vel_xy = 0.5

[noise]
add_noise = true

[init_state]
pos = [0.0, 0.0, 0.35]

[commands]
resampling_time = [2.5, 4.0]

[commands.limit]
lin_vel_x = [0.0, 1.25]
lin_vel_y = [0.0, 0.0]
ang_vel_z = [-1.2, 1.2]

[commands.ranges]
lin_vel_x = [0.55, 0.80]
lin_vel_y = [0.0, 0.0]
ang_vel_yaw = [0.0, 0.0]

[navigation]
enabled = false

[p22_lbc_loco]
learning_rate = 5e-4
max_iterations = 10000
max_grad_norm = 1.0
log_interval = 100
save_interval = 1000
num_steps_per_env = 24
student_drive = false

[camera.depth_camera]
offset_pos = [0.486886, 0.024533, 0.079897]
offset_rot = [0.995199, -0.001619, 0.097217, 0.011225]
