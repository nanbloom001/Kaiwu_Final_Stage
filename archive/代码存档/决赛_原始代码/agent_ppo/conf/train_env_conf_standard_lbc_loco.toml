# LBC Loco training configuration.
# LBC Loco 训练配置。
#
# The teacher (a frozen locomotion ckpt) runs normal eval in sim and drives the env;
# the student (VisionEncoder, CNN+LSTM) learns to approximate the teacher latent
# from depth_image with an MSE loss.
# 教师（冻结的 locomotion ckpt）在仿真中正常 eval / 驱动环境；
# 学生（VisionEncoder, CNN+LSTM）从 depth_image 学习逼近教师 latent（MSE loss）。
#
# Key points:
#   1. LBC is not RL — there is no [rewards] section.
#   2. Policy obs = [proprio(45) | height_scan(256) | depth(57600)] = 57901D,
#      concatenated by LBCObservationProcess and sliced by offset in lbc_workflow.
#   3. Terrain / domain randomization / velocity commands match Stage 1 locomotion
#      exactly, so the teacher-driven walking distribution matches the original training distribution.
# 关键点：
#   1. LBC 不是 RL —— 无 [rewards] section
#   2. Policy obs = [proprio(45) | height_scan(256) | depth(57600)] = 57901D
#      （由 LBCObservationProcess 拼接，lbc_workflow 按偏移切分）
#   3. 地形 / 域随机化 / 速度命令与 Stage 1 locomotion 完全一致，
#      保证教师驱动环境时行走分布与原训练分布相符

# Basic Configuration
# 基础配置
[env]
# Number of parallel environments. Camera scene is VRAM-intensive, so keep it small (≤ 256).
# 并行环境数量。带相机的 scene 显存开销大，保持较小（≤ 256）
num_envs = 256
# Max episode duration (seconds).
# 最大 episode 时长（秒）
episode_length_s = 25
# Legacy field, not consumed by base_env (terrain mode is read from [terrain].mode).
# 遗留字段，base_env 不读取（地形模式由 [terrain].mode 决定）
task = "standard"

[env_conf]
# Isaac Lab task entry. LBC distillation needs a TiledCamera depth sensor, so use the camera variant.
# locomotion/hier_nav training uses the base "Unitree-Go2-Velocity" to avoid render OOM.
# Isaac Lab 任务入口。LBC 蒸馏需要 TiledCamera 深度相机 → 走带相机的任务变体
# locomotion/hier_nav 训练用基础 "Unitree-Go2-Velocity"，避免渲染 OOM
task_name = "Unitree-Go2-Velocity-Camera"
# Random seed.
# 随机种子
seed = 0

# Terrain Configuration (consistent with Stage 1)
# 地形配置（与 Stage 1 一致）
[terrain]
# Terrain mode, valid values: "standard" | "track".
# 地形模式，合法值："standard" | "track"
mode = "standard"
# Number of difficulty tiers (curriculum levels along X), valid range [1, 10].
# 难度级别数（沿 X 轴的课程档位），合法范围 [1, 10]
num_rows = 10
# Parallel plots within the same difficulty tier along Y, valid range [1, 40].
# 同一难度下的并行地块数（沿 Y 轴），合法范围 [1, 40]
num_cols = 20
# Difficulty range [min, max], valid range: [0.0, 1.0].
# 难度范围 [min, max]，合法范围：[0.0, 1.0]
difficulty_range = [0.0, 1.0]
# Whether to enable terrain curriculum (promote/demote difficulty by performance).
# 是否启用地形课程学习（按表现晋级/降级难度）
curriculum = true
# Max init difficulty tier for robot placement, valid range: [0, 9].
# 机器人初始放置的最大难度档，合法范围：[0, 9]
max_init_terrain_level = 5

# Pre-expose side walls on high-difficulty standard terrain (consistent with Stage 1 locomotion).
# 高难度 standard 地形侧墙预暴露（与 Stage 1 locomotion 保持一致）
[terrain.standard_wall]
# Master switch: whether to add side walls to eligible high-difficulty standard sub-terrains.
# 总开关：是否给符合条件的高难度 standard 子地形添加侧墙
enabled = true
# Difficulty below which side walls are never added.
# 低于此难度时绝不加侧墙
min_difficulty = 0.60
# Difficulty at which wall probability reaches max_probability (linear ramp from min to full).
# 墙体概率达到 max_probability 的难度（min→full 之间线性上升）
full_difficulty = 0.90
# Maximum probability of adding side walls to an eligible tile.
# 给符合条件的地块添加侧墙的最大概率
max_probability = 0.15
# Random side-wall height range [min, max] (m).
# 侧墙高度随机采样范围 [min, max]（米）
height_range = [0.25, 0.45]
# Random side-wall thickness range [min, max] (m).
# 侧墙厚度随机采样范围 [min, max]（米）
thickness_range = [0.10, 0.15]
# Random margin from terrain side boundary to wall outer face [min, max] (m).
# 地形侧边界到墙外面的间距随机采样范围 [min, max]（米）
margin_range = [0.05, 0.10]
# Sub-terrain class-name keywords eligible for wall augmentation.
# 可添加侧墙的子地形类名关键字
eligible_keywords = ["slope", "stairs"]
# Sub-terrain class-name keywords excluded from wall augmentation.
# 排除在侧墙增强之外的子地形类名关键字
exclude_keywords = ["maze", "corridor"]

# Sub-terrain proportions (all proportions must sum to 1.0).
# proportion: fraction of plots assigned to this sub-terrain.
# step_height_range [min, max] (m): stair step height random range.
# 子地形比例（所有 proportion 之和必须 = 1.0）
# proportion：分配给该子地形的地块比例
# step_height_range [min, max]（米）：台阶高度随机范围
[terrain.standard.pyramid_slope]
proportion = 0.15

[terrain.standard.pyramid_slope_inv]
proportion = 0.2

[terrain.standard.pyramid_stairs]
proportion = 0.25
#step_height_range = [0.05, 0.23]

[terrain.standard.pyramid_stairs_inv]
proportion = 0.3
#step_height_range = [0.05, 0.23]

[terrain.standard.maze]
proportion = 0.1
# Width of the flat platform at the maze center (m).
# 迷宫中心平台宽度（米）
platform_width = 3.0


# Domain Randomization (consistent with Stage 1)
# 域随机化（与 Stage 1 一致）
[domain_rand]
# Master switch for domain randomization.
# 域随机化总开关
enable_domain_rand = true
# Whether to randomize ground friction.
# 是否随机化地面摩擦系数
randomize_friction = true
# Friction range [min, max], must be >= 0.
# 摩擦系数采样范围 [min, max]，必须 >= 0
friction_range = [0.3, 1.5]
# Whether to periodically push the robot.
# 是否周期性对机器人施加外部推力
push_robots = true
# Push interval (seconds), must be > 0.
# 推力间隔（秒），必须 > 0
push_interval_s = 15
# Max push velocity in XY plane (m/s), must be >= 0.
# XY 平面最大推力速度 (m/s)，必须 >= 0
max_push_vel_xy = 0.5

# Observation Noise
# 观测噪声
[noise]
# Whether to add noise to observations.
# 是否在观测中加入噪声
add_noise = true

# Initial State
# 初始状态
[init_state]
# Robot initial position [x, y, z] (m); z valid range [0.30, 0.60]m.
# 机器人初始位置 [x, y, z] (m)；z 合法范围：[0.30, 0.60]m
pos = [0.0, 0.0, 0.35]

# Velocity Commands (for the teacher, consistent with Stage 1)
# 速度命令（教师用，与 Stage 1 一致）
[commands]
resampling_time = [10.0, 10.0]

[commands.ranges]
# LBC 无 command curriculum，命令始终在此区间均匀采样（与 hier_nav 一致）。
lin_vel_x = [-0.2, 0.65]
lin_vel_y = [-0.15, 0.15]
ang_vel_yaw = [-1.3, 1.3]

# Lock curriculum-expansion upper bound to the initial ranges, preventing
# lin_vel_cmd_levels / ang_vel_cmd_levels from expanding the command range to
# the hard-coded default limit_ranges in velocity_env_cfg
# ((-2.0, 2.0) / (-1.5, 1.5) / (-1.5, 1.5)), which would drive the frozen
# teacher OOD and cause distillation sample drift.
# 锁死 curriculum 扩张上限 = 初始 ranges，避免 lin_vel_cmd_levels /
# ang_vel_cmd_levels 把命令区间扩到 velocity_env_cfg 硬编码的默认 limit_ranges
# ((-2.0, 2.0) / (-1.5, 1.5) / (-1.5, 1.5))，让教师推理 OOD 导致蒸馏样本漂移。
[commands.limit]
lin_vel_x = [-0.2, 0.65]
lin_vel_y = [-0.15, 0.15]
ang_vel_z = [-1.3, 1.3]


# LBC-specific parameters (matching LBCLocoConfig; priority on read is TOML > class default).
# LBC 专用参数（与 LBCLocoConfig 对应，读取时优先级 TOML > class default）
[lbc_loco]
# 蒸馏阶段保守 lr（更高值下 angle/mse 会原地震荡不收敛）；lr_min 可选，未给则用 conf.py 默认 1e-5。
learning_rate = 5e-4
max_iterations = 10000
max_grad_norm = 1.0
# Print MSE loss every N steps.
# 每 N 步打印 MSE loss
log_interval = 100
# Save vision_encoder ckpt every N steps.
# 每 N 步保存 vision_encoder ckpt
save_interval = 1000
# Steps collected from env per round.
# 每轮从 env 采集的步数
num_steps_per_env = 24

# Student-drive mode: student closed-loop drives env, no backward pass, MSE only as a metric.
# 学生驱动模式：学生闭环驱动 env，不做反向传播，仅计算 MSE 作为指标
#   student_drive = true  → preload vision ckpt + visualize student perf
#   student_drive = true  → 配合 preload 的 vision ckpt 可视化学生表现
#   student_drive = false → standard distillation training (default)
#   student_drive = false → 标准蒸馏训练（默认）
student_drive = false


# Depth Camera Configuration
# 深度相机配置
# Defaults for camera parameters (resolution / FOV / intrinsics / range / mount pose)
# come from the TiledCameraCfg in tools/unitree_rl_lab/unitree_rl_lab/tasks/locomotion/robots/go2/velocity_env_cfg.py.
# At runtime base_env.apply_usr_conf_to_env_cfg overrides defaults with this TOML's
# [camera.<name>] (fields not written in TOML keep the env_cfg.py defaults).
# 相机参数（分辨率 / FOV / 内参 / 量程 / 安装位姿）的默认值由
# tools/unitree_rl_lab/unitree_rl_lab/tasks/locomotion/robots/go2/velocity_env_cfg.py 的 TiledCameraCfg 给出，
# 运行时 base_env.apply_usr_conf_to_env_cfg 会用本 TOML 的 [camera.<name>] 覆盖默认值
# （TOML 未写的字段保留 env_cfg.py 默认值）。
#
# Intrinsics / range / resolution are shared D435i hardware constants (identical for the
# same model + same depth mode); aligning with hardware only needs calibrating each
# machine's mount pose offset_pos / offset_rot.
# So only the per-machine pose is listed here; fixed items (focal_length / horizontal_aperture /
# clipping_range / width / height / prim_path / convention / data_types /
# depth_clipping_behavior) take env_cfg.py defaults and are not repeated in TOML.
# 内参 / 量程 / 分辨率是 D435i 的硬件公共常数（同型号 + 同深度模式一致），
# 对齐真机只需校准每台机器的安装位姿 offset_pos / offset_rot。
# 故此处只列随机器变化的位姿；固定项（focal_length / horizontal_aperture /
# clipping_range / width / height / prim_path / convention / data_types /
# depth_clipping_behavior）走 env_cfg.py 默认值，不在 TOML 重复。
[camera.depth_camera]
# Camera mount position in robot base frame (x forward, y left, z up), unit m, calibrated per machine.
# 相机在机器人 base 系下的安装位置 (x前, y左, z上)，单位 m，逐台校准。
offset_pos = [0.486886, 0.024533, 0.079897]
# Camera mount orientation quaternion (w, x, y, z), world convention, calibrated per machine.
# 相机安装姿态 quaternion (w, x, y, z)，world convention，逐台校准。
offset_rot = [0.995199, -0.001619, 0.097217, 0.011225]

# No [rewards] section.
# 不配置 [rewards]
# LBC is pure supervised learning (MSE loss) with no reward. RL reward config has no effect in this stage.
# LBC 为纯监督学习（MSE loss），没有 reward。RL reward 配置对本阶段无效。
