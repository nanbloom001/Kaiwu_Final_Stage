[env]
num_envs = 3072
episode_length_s = 120.0

[env_conf]
seed = 0

[terrain]
mode = "track"
num_rows = 10
num_cols = 10
difficulty_range = [0.0, 1.0]
curriculum = false
max_init_terrain_level = 0

[terrain.track]
track_length = 5
sub_terrains = ["pyramid_slope", "pyramid_slope_inv", "pyramid_stairs", "pyramid_stairs_inv", "open_entry_maze"]

[domain_rand]
enable_domain_rand = true
randomize_friction = true
friction_range = [0.45, 1.4]
push_robots = false
push_interval_s = 15
max_push_vel_xy = 0.5

[noise]
add_noise = true

[init_state]
pos = [0.0, 0.0, 0.35]

[commands]
resampling_time = [2.5, 4.0]

[commands.limit]
lin_vel_x = [0.0, 1.25]
lin_vel_y = [-0.0, 0.0]
ang_vel_z = [-1.2, 1.2]

[commands.ranges]
lin_vel_x = [0.55, 0.80]
lin_vel_y = [0.0, 0.0]
ang_vel_yaw = [0.0, 0.0]

[navigation]
enabled = false

[rl_navigation]
phase_command_enabled = true
worker_phase_command_enabled = true
gate_test_mode = "sticky"
shadow_selected_gate = "sticky"
terrain_sticky_source = "nan"
gate_speed_advice_enabled = true
gate_reward_metrics_enabled = true
gate_diagnostics_enabled = false
raw_terrain_gate_enabled = true
suggested_speed_fallback = 0.68
pre_maze_lin_vel_x = [0.8, 0.8]
slope_lin_vel_x = [0.80, 0.80]
stairs_lin_vel_x = [0.7, 0.70]
maze_lin_vel_x = [0.70, 0.70]
phase_maze_goal_dist_gate = 8.5
phase_maze_distance_mode = "longitudinal"
phase_maze_goal_longitudinal_min = -1.0
phase_maze_confirm_steps = 3
phase_maze_release_margin = 2.0
phase_maze_sticky_until_done = true
phase_command_resample_steps = 160
terrain_phase_speed_enabled = true
terrain_sticky_confirm_steps = 4
terrain_sticky_flat_release_steps = 10
terrain_sticky_slope_hold_steps = 30
terrain_sticky_stairs_hold_steps = 25
terrain_sticky_wall_hold_steps = 40
terrain_flat_release_edge_max = 0.025
terrain_flat_release_delta_max = 0.025
terrain_flat_release_pitch_max = 0.10
terrain_updown_full_delta = 0.12
fused_gate_stair_edge_threshold = 0.040
fused_gate_stair_locality_threshold = 0.30
fused_gate_stair_smoothness_max = 0.45
fused_gate_slope_edge_mean_min = 0.006
fused_gate_slope_smoothness_min = 0.60
fused_gate_slope_edge_max = 0.080
fused_gate_wall_edge_threshold = 0.30
fused_gate_direction_margin = 0.02
nan_gate_body_y_start = 5
nan_gate_body_y_end = 11
nan_gate_x_start = 0
nan_gate_x_end = 10
nan_gate_stair_edge_threshold = 0.040
nan_gate_stair_locality_threshold = 0.30
nan_gate_stair_smoothness_max = 0.45
nan_gate_slope_edge_mean_min = 0.006
nan_gate_slope_smoothness_min = 0.60
nan_gate_slope_edge_max = 0.070
nan_gate_wall_edge_threshold = 0.30
nan_gate_direction_margin = 0.02
nav_gate_wall_edge_threshold = 0.30
nav_wall_body_y_start = 3
nav_wall_body_y_end = 10
nav_wall_front_cols = 6
nav_wall_side_width = 3
nav_wall_height_threshold = 0.24
nav_wall_temperature = 0.08
nav_wall_score_threshold = 0.35
nav_wall_floor_quantile = 0.20
nav_wall_gate_in_maze_only = true

# -----------------------------------------------------------------------------
# Locomotion preservation: keep enough of the old walking objective so the
# pretrained model does not forget stable gait while learning navigation.
# -----------------------------------------------------------------------------
[rewards.track_lin_vel_xy]
weight = 1.08
[rewards.track_lin_vel_xy.params]
std = 0.24
command_name = "base_velocity"

[rewards.command_speed_advantage]
weight = 0.75
[rewards.command_speed_advantage.params]
command_name = "base_velocity"
deadband = 0.02
surplus_scale = 0.28
lag_scale = 0.25
max_surplus = 0.45
max_lag = 0.50
lag_penalty_scale = 1.0
min_command = 0.10

[rewards.track_ang_vel_z]
weight = 0.045
[rewards.track_ang_vel_z.params]
std = 0.35
command_name = "base_velocity"

[rewards.lin_vel_z]
weight = -0.60

[rewards.ang_vel_xy]
weight = -0.55

[rewards.joint_acc]
weight = -4.5e-7

[rewards.energy]
weight = -4.8e-5

[rewards.energy_score_formula]
weight = 1.35

[rewards.joint_torques]
weight = -2.8e-5

[rewards.dof_pos_limits]
weight = -0.3

[rewards.correct_base_height]
weight = -0.30
[rewards.correct_base_height.params]
target_height = 0.38

[rewards.action_rate]
weight = -0.018

[rewards.action_smoothness]
weight = -0.018

[rewards.undesired_contacts]
weight = -0.62
[rewards.undesired_contacts.params]
threshold = 1

[rewards.termination]
weight = -9.0

[rewards.speed_gate_flat]
weight = 1.0e-9

[rewards.speed_gate_slope]
weight = 1.0e-9

[rewards.speed_gate_stairs]
